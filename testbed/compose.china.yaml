# 中国本地覆盖层：必须在 compose.yaml 之后加载。
# 默认使用公开镜像；如需代理只通过环境变量提供，禁止在文件中写入凭据。
name: dsh-testbed-quota-panel-china

services:
  testbed:
    build:
      args:
        NODE_IMAGE: "${NODE_IMAGE:-docker.m.daocloud.io/library/node:24-bookworm-slim}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
        # slim 基础层尚无 CA bundle；默认 HTTP 由 apt 仓库签名校验，安装 CA 后可自行覆盖 HTTPS。
        APT_MIRROR: "${APT_MIRROR:-http://mirrors.aliyun.com/debian}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: "dsh-testbed-quota-panel-china:${DSH_VERSION:-0.1.5-rc.1}"
    environment:
      NPM_CONFIG_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
