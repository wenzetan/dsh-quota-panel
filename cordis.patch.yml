# dsh-quota-panel bundle patch: mounts the quota panel into a dsh profile.
# Applied as a profile layer when this package is installed with
# `dsh plugin --profile web add "github:owner/dsh-quota-panel"`.
#
# v0.5: the built-in catalog auto-discovers every provider whose standard
# credential reference resolves (DEEPSEEK_API_KEY, OPENROUTER_API_KEY,
# SILICONFLOW_API_KEY / SILICONFLOW_CN_API_KEY, MOONSHOT_API_KEY,
# MINIMAX_API_KEY / MINIMAX_CN_API_KEY, STEP_API_KEY / STEPFUN_API_KEY,
# XAI_API_KEY, ZHIPU_API_KEY / GLM_API_KEY, ZAI_API_KEY /
# ZAI_CODING_CN_API_KEY, KIMI_API_KEY, OPENCODE_GO_API_KEY) — no patch
# config needed for those. This bundle therefore ships NO explicit provider
# rows: the panel shows exactly the providers whose key resolves. If you
# want rows outside the catalog, add them to `providers:` below (same-id
# entries replace catalog rows wholesale). Set `auto: false` to list
# everything by hand, `hide: [id...]` to drop single rows, and
# `catalog: {<id>: {...}}` for partial overrides.
#
# Providers that cannot be reached directly (e.g. from within mainland
# China) can route through an HTTP proxy. The primary way is the frontend
# settings panel (settings gear -> proxy): one proxy URL per provider,
# persisted to browser localStorage, applied immediately. The config below
# acts as the profile-level default, used when the frontend leaves the row
# empty; precedence: frontend settings > profile config > direct.
#
#   config:
#     proxies:
#       home: http://127.0.0.1:7890
#     catalog:
#       openrouter:
#         proxy: home
#
# Explicit providers may set `proxy: home` per entry the same way.

- insert:
    - id: quota-panel
      name: 'dsh-quota-panel'
      config:
        refreshMs: 60000
        # No explicit providers: the built-in catalog auto-discovers every
        # provider whose standard credential reference resolves, so the panel
        # shows exactly the providers you configured a key for. Explicit
        # entries only belong here for providers outside the catalog (see the
        # README "Explicit providers" section and the comments above).
        providers: []
