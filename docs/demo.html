<style>

  .chrome { display: flex; height: 100vh; }

<script>
window.fetch = function (url) {
  var data;
  if (String(url).indexOf('deepseek') >= 0) {
    data = { is_available: true, balance_infos: [{ currency: 'CNY', total_balance: '58.36', granted_balance: '0.00', topped_up_balance: '58.36' }] };
  } else if (String(url).indexOf('zhipu') >= 0) {
    data = { info: { text: '已用配额 12.5 万 tokens / 100 万（今日 08:00 重置）', title: 'quota limit: 1000000 tokens' } };
  } else if (String(url).indexOf('zai-coding-cn') >= 0) {
    data = { usage: {
      rolling: { percent: 64, resetsAt: new Date(Date.now() + 2.5 * 3600e3).toISOString() },
      monthly: { percent: 3, resetsAt: new Date(Date.now() + 2.5 * 3600e3).toISOString() }
    } };
  } else if (String(url).indexOf('kimi-coding') >= 0) {
    data = { usage: {
      rolling: { percent: 70, resetsAt: new Date(Date.now() + 3 * 3600e3).toISOString() },
      weekly: { percent: 10, resetsAt: new Date(Date.now() + 2 * 86400e3).toISOString() }
    } };
  } else {
    data = { usage: {
      rolling: { status: 'ok', percent: 10, resetsAt: new Date(Date.now() + 4 * 3600e3).toISOString() },
      weekly:  { status: 'warn', percent: 72, resetsAt: new Date(Date.now() + 2 * 86400e3).toISOString() },
      monthly: { status: 'ok', percent: 22, resetsAt: new Date(Date.now() + 27 * 86400e3).toISOString() }
    } };
  }
  return Promise.resolve({ json: function () { return Promise.resolve(data); } });
};
</script>
<script>(function () {
  var AUTO_MS = 60000;

  var panelId = 'dsh-quota-panel';
  var capsuleId = 'dsh-quota-capsule';
  var cardId = 'dsh-quota-card';
  var VIEWS = {};      // spec.id -> view object
  var STATE = {};      // spec.id -> { status, summary }
  var CAPSULE_DOTS = {};   // spec.id -> capsule dot element
  var CAPSULE_VALUES = {}; // spec.id -> capsule value element
  var capsuleEl = null;
  var cardEl = null;
  var refreshBtn = null;
  var settingsBtn = null;
  var settingsEl = null;
  var refreshing = false;
  var settingsOpen = false;

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function fmtReset(iso) {
    var ms = new Date(iso).getTime() - Date.now();
    if (!isFinite(ms) || ms <= 0) return '即将重置';
    var s = Math.floor(ms / 1000);
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600); s -= h * 3600;
    var m = Math.round(s / 60);
    if (m === 60) { h += 1; m = 0; }
    if (h === 24) { d += 1; h = 0; }
    var parts = [];
    if (d) parts.push(d + '天');
    if (h) parts.push(h + '小时');
    if (m) parts.push(m + '分');
    return parts.length ? parts.join('') : '即将重置';
  }

  function setState(view, state) {
    view.root.classList.remove('state-loading', 'state-ok', 'state-warn', 'state-error');
    view.root.classList.add('state-' + state);
  }

  // Collapsed capsule: each provider renders its own dot + value pair with
  // independent status. Usage values are battery-colored (green/amber/red
  // by usage level); balance values stay neutral unless warn/error.
  function renderCapsule() {
    for (var i = 0; i < ROWS.length; i++) {
      var spec = ROWS[i];
      var s = STATE[spec.id];
      var dot = CAPSULE_DOTS[spec.id];
      var valueEl = CAPSULE_VALUES[spec.id];
      if (!dot || !valueEl) continue;
      var status = s ? s.status : 'loading';
      var isUsage = spec.format === 'opencode-usage';
      dot.className = 'dsh-capsule-dot state-' + status;
      valueEl.className = 'dsh-capsule-item' + (isUsage ? ' dsh-usage' : '') + ' state-' + status;
      valueEl.textContent = s ? s.summary : '…';
    }
  }

  function setExpanded(open) {
    capsuleEl.hidden = open;
    cardEl.hidden = !open;
    capsuleEl.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) refreshAll();
  }

  function setSettingsOpen(open) {
    settingsOpen = open;
    if (settingsBtn) {
      settingsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      settingsBtn.setAttribute('aria-label', open ? '关闭设置' : '打开设置');
      settingsBtn.classList.toggle('is-active', open);
    }
    settingsEl.hidden = !open;
  }

  function renderSettings() {
    var root = el('div', 'dsh-quota-settings');
    // 显示供应商
    var vis = el('div', 'dsh-setting-section');
    vis.appendChild(el('div', 'dsh-setting-title', '显示供应商'));
    for (var i = 0; i < ROWS.length; i++) {
      var spec = ROWS[i];
      var row = el('div', 'dsh-setting-row');
      row.appendChild(el('span', 'dsh-setting-name', spec.label));
      var box = el('input', 'dsh-setting-check');
      box.type = 'checkbox';
      box.checked = true;
      row.appendChild(box);
      vis.appendChild(row);
    }
    root.appendChild(vis);
    // 刷新间隔
    var ref = el('div', 'dsh-setting-section');
    ref.appendChild(el('div', 'dsh-setting-title', '刷新间隔'));
    var refRow = el('div', 'dsh-setting-row');
    refRow.appendChild(el('span', 'dsh-setting-name', '自动刷新'));
    var sel = el('select', 'dsh-setting-select');
    ['跟随配置（60 秒）', '15 秒', '30 秒', '1 分钟', '2 分钟', '5 分钟'].forEach(function (label, i) {
      var opt = el('option', '', label);
      if (i === 0) opt.selected = true;
      sel.appendChild(opt);
    });
    refRow.appendChild(sel);
    ref.appendChild(refRow);
    root.appendChild(ref);
    // 代理
    var proxy = el('div', 'dsh-setting-section');
    proxy.appendChild(el('div', 'dsh-setting-title', '代理'));
    var hint = el('div', 'dsh-setting-hint', '填写 http(s) 代理 URL，仅该供应商经此代理查询');
    hint.style.marginBottom = '4px';
    proxy.appendChild(hint);
    for (var j = 0; j < ROWS.length; j++) {
      var pRow = el('div', 'dsh-setting-row');
      pRow.appendChild(el('span', 'dsh-setting-name', ROWS[j].label));
      var input = el('input', 'dsh-setting-input dsh-setting-proxy');
      input.type = 'text';
      input.placeholder = 'http://127.0.0.1:7890（留空直连）';
      pRow.appendChild(input);
      proxy.appendChild(pRow);
    }
    root.appendChild(proxy);
    // 预警阈值
    var warn = el('div', 'dsh-setting-section');
    warn.appendChild(el('div', 'dsh-setting-title', '预警阈值'));
    for (var k = 0; k < ROWS.length; k++) {
      var spec2 = ROWS[k];
      var wRow = el('div', 'dsh-setting-row');
      var isUsage = spec2.format === 'opencode-usage';
      wRow.appendChild(el('span', 'dsh-setting-name', spec2.label + (isUsage ? '（%）' : '（¥）')));
      var wInput = el('input', 'dsh-setting-input');
      wInput.type = 'number';
      wInput.min = '0';
      wInput.placeholder = isUsage ? '预警 %（默认 70）' : '预警 ¥（默认 20）';
      wRow.appendChild(wInput);
      warn.appendChild(wRow);
    }
    root.appendChild(warn);
    // 底部
    var foot = el('div', 'dsh-setting-actions');
    foot.appendChild(el('span', 'dsh-setting-hint', '设置仅保存在本浏览器'));
    foot.appendChild(el('button', 'dsh-setting-reset', '恢复默认'));
    root.appendChild(foot);
    return root;
  }

  function createProviderView(spec) {
    var root = el('div', 'dsh-provider state-loading');
    var main = el('div', 'dsh-provider-main');
    var dot = el('span', 'dsh-status-dot');
    var body = el('div', 'dsh-provider-body');
    var head = el('div', 'dsh-provider-head');
    var nameEl = el('span', 'dsh-provider-name', spec.label);
    var value = null, sub = null, usage = null, track = null, progress = null, caption = null;

    head.appendChild(nameEl);
    if (spec.format === 'deepseek-balance') {
      value = el('span', 'dsh-provider-value', '—');
      head.appendChild(value);
      sub = el('div', 'dsh-provider-sub', '正在更新…');
    } else if (spec.kind === 'info') {
      sub = el('div', 'dsh-provider-sub', '正在更新…');
    } else {
      usage = el('div', 'dsh-usage-values', '正在更新…');
      track = el('div', 'dsh-progress');
      progress = el('div', 'dsh-progress-fill');
      track.appendChild(progress);
      caption = el('div', 'dsh-usage-caption', '');
    }
    body.appendChild(head);
    if (sub) body.appendChild(sub);
    if (usage) body.appendChild(usage);
    if (progress) body.appendChild(track);
    if (caption) body.appendChild(caption);

    main.appendChild(dot);
    main.appendChild(body);
    root.appendChild(main);
    return { root, dot, name: nameEl, value, sub, usage, progress, caption };
  }

  function renderDeepSeek(view, spec, data) {
    var info = data && data.balance_infos && data.balance_infos[0];
    if (!data || data.error || !info) {
      setState(view, 'error');
      view.value.textContent = '—';
      view.sub.textContent = '暂时无法获取余额';
      view.root.title = data && data.error ? String(data.error) : 'no balance info';
      STATE[spec.id] = { status: 'error', summary: '—' };
      renderCapsule();
      return;
    }
    var total = Number(info.total_balance);
    if (!Number.isFinite(total)) {
      setState(view, 'error');
      view.value.textContent = '—';
      view.sub.textContent = '余额数据异常';
      view.root.title = 'non-numeric total_balance';
      STATE[spec.id] = { status: 'error', summary: '—' };
      renderCapsule();
      return;
    }
    view.value.textContent = '¥' + total.toFixed(2);
    var tiers = spec.balanceTiers || { critical: 10, warn: 20, healthy: 50 };
    var status;
    if (total <= tiers.critical) {
      status = 'error';
      view.sub.textContent = '建议充值';
    } else if (total <= tiers.warn) {
      status = 'warn';
      view.sub.textContent = '余额紧张';
    } else if (total <= tiers.healthy) {
      status = 'ok';
      view.sub.textContent = '余额正常';
    } else {
      status = 'ok';
      view.sub.textContent = '余额充足';
    }
    setState(view, status);
    view.root.title = 'currency: ' + info.currency + '\ngranted: ¥' + info.granted_balance + '\ntopped-up: ¥' + info.topped_up_balance;
    STATE[spec.id] = { status: status, summary: '¥' + total.toFixed(2) };
    renderCapsule();
  }

  function renderUsage(view, spec, data) {
    var u = data && data.usage;
    var error = function (message) {
      setState(view, 'error');
      view.usage.textContent = '暂时无法获取用量';
      view.progress.style.width = '0%';
      view.caption.textContent = '';
      view.root.title = message;
      STATE[spec.id] = { status: 'error', summary: '—' };
      renderCapsule();
    };
    if (!data || data.error || !u) {
      error(data && data.error ? String(data.error) : 'usage unavailable');
      return;
    }
    var winPct = function (win) {
      return win && typeof win.percent === 'number' && isFinite(win.percent) ? win.percent : null;
    };
    var rp = winPct(u.rolling), wp = winPct(u.weekly), mp = winPct(u.monthly);
    var present = [rp, wp, mp].filter(function (v) { return v !== null; });
    if (!present.length) {
      error('usage windows missing');
      return;
    }
    var high = Math.max.apply(null, present);
    var labels = spec.windowLabels || { rolling: '滚', weekly: '周', monthly: '月' };
    var fmtWin = function (label, v) { return label + ' ' + (v === null ? '—' : v + '%'); };

    // weekly-only plans (ChatGPT Plus / Codex) drop empty 滚/月 noise and
    // surface the weekly reset time inline.
    var weeklyOnly = rp === null && wp !== null && mp === null;
    var textSegs;
    if (weeklyOnly) {
      textSegs = [fmtWin(labels.weekly, wp)];
      if (u.weekly && u.weekly.resetsAt) textSegs.push('下次重置 ' + fmtReset(u.weekly.resetsAt));
    } else {
      textSegs = [fmtWin(labels.rolling, rp)];
      if (wp !== null) textSegs.push(fmtWin(labels.weekly, wp));
      textSegs.push(labels.monthly + ' ' + (mp === null ? '-%' : mp + '%'));
    }
    view.usage.textContent = textSegs.join(' · ');
    view.progress.style.width = Math.min(Math.max(high, 0), 100) + '%';
    view.caption.textContent = '当前已使用 ' + high + '%';

    var status;
    if (high >= spec.errorPercent) status = 'error';
    else if (high >= spec.warnPercent) status = 'warn';
    else status = 'ok';
    setState(view, status);

    var titleLine = function (label, v, win) {
      return label + ': ' + (v === null ? '无数据' : v + '%（重置于 ' + fmtReset(win && win.resetsAt) + '）');
    };
    var titleLines = [titleLine(labels.rolling, rp, u.rolling)];
    if (wp !== null) titleLines.push(titleLine(labels.weekly, wp, u.weekly));
    titleLines.push(titleLine(labels.monthly, mp, u.monthly));
    view.root.title = titleLines.join('\n');
    STATE[spec.id] = { status: status, summary: high + '%' };
    renderCapsule();
  }

  function renderInfo(view, spec, data) {
    var info = data && data.info;
    if (!data || data.error || !info || !info.text) {
      setState(view, 'error');
      view.sub.textContent = '暂时无法获取配额';
      view.root.title = data && data.error ? String(data.error) : 'no info';
      STATE[spec.id] = { status: 'error', summary: '—' };
      renderCapsule();
      return;
    }
    var text = String(info.text);
    setState(view, 'info');
    view.sub.textContent = text;
    view.root.title = info.title ? String(info.title) : '';
    STATE[spec.id] = { status: 'info', summary: text.length > 12 ? text.slice(0, 12) + '…' : text };
    renderCapsule();
  }

  function renderProviderError(view, spec, error) {
    setState(view, 'error');
    if (spec.format === 'deepseek-balance') {
      view.value.textContent = '—';
      view.sub.textContent = '暂时无法获取余额';
    } else {
      view.usage.textContent = '暂时无法获取用量';
      view.progress.style.width = '0%';
      view.caption.textContent = '';
    }
    view.root.title = String(error && error.message ? error.message : error);
    STATE[spec.id] = { status: 'error', summary: '—' };
    renderCapsule();
  }

  function createPanel() {
    var panel = el('div');
    panel.id = panelId;

    // Collapsed capsule: one dot + value pair per provider, no text labels.
    capsuleEl = el('button', 'dsh-quota-capsule');
    capsuleEl.id = capsuleId;
    capsuleEl.type = 'button';
    capsuleEl.setAttribute('aria-label', '展开模型额度');
    capsuleEl.setAttribute('aria-expanded', 'false');
    for (var i = 0; i < ROWS.length; i++) {
      var spec = ROWS[i];
      var dot = el('span', 'dsh-capsule-dot state-loading');
      var valueEl = el('span', 'dsh-capsule-item state-loading', '…');
      CAPSULE_DOTS[spec.id] = dot;
      CAPSULE_VALUES[spec.id] = valueEl;
      capsuleEl.appendChild(dot);
      capsuleEl.appendChild(valueEl);
    }
    capsuleEl.appendChild(el('span', 'dsh-capsule-chevron', '▾'));
    capsuleEl.addEventListener('click', function () { setExpanded(true); });
    panel.appendChild(capsuleEl);

    // Expanded card.
    cardEl = el('div');
    cardEl.id = cardId;
    cardEl.hidden = true;
    var header = el('div', 'dsh-quota-header');
    header.appendChild(el('div', 'dsh-quota-title', '模型额度'));
    var actions = el('div', 'dsh-quota-actions');
    refreshBtn = el('button', 'dsh-quota-icon', '↻');
    refreshBtn.type = 'button';
    refreshBtn.setAttribute('aria-label', '刷新模型额度');
    refreshBtn.addEventListener('click', function () { refreshAll(); });
    var settingsBtn = el('button', 'dsh-quota-icon', '⚙');
    settingsBtn.type = 'button';
    settingsBtn.setAttribute('aria-label', '打开设置');
    settingsBtn.setAttribute('aria-expanded', 'false');
    settingsBtn.addEventListener('click', function () { setSettingsOpen(!settingsOpen); });
    var collapseBtn = el('button', 'dsh-quota-icon', '▴');
    collapseBtn.type = 'button';
    collapseBtn.setAttribute('aria-label', '收起模型额度');
    collapseBtn.addEventListener('click', function () { setExpanded(false); });
    actions.appendChild(refreshBtn);
    actions.appendChild(settingsBtn);
    actions.appendChild(collapseBtn);
    header.appendChild(actions);
    cardEl.appendChild(header);
    for (var i = 0; i < ROWS.length; i++) {
      if (i > 0) cardEl.appendChild(el('div', 'dsh-quota-divider'));
      var view = createProviderView(ROWS[i]);
      VIEWS[ROWS[i].id] = view;
      cardEl.appendChild(view.root);
    }
    settingsEl = renderSettings();
    settingsEl.hidden = true;
    cardEl.appendChild(settingsEl);
    panel.appendChild(cardEl);
    return panel;
  }

  async function refreshProvider(spec) {
    var view = VIEWS[spec.id];
    if (!view) return;
    try {
      var response = await fetch('/api/quota/' + encodeURIComponent(spec.id), { cache: 'no-store' });
      var data = await response.json();
      if (spec.format === 'deepseek-balance') renderDeepSeek(view, spec, data);
      else if (spec.kind === 'info') renderInfo(view, spec, data);
      else renderUsage(view, spec, data);
    } catch (error) {
      renderProviderError(view, spec, error);
    }
  }

  async function refreshAll() {
    if (refreshing) return;
    refreshing = true;
    refreshBtn.disabled = true;
    refreshBtn.classList.add('is-loading');
    try {
      await Promise.all(ROWS.map(function (spec) { return refreshProvider(spec); }));
    } finally {
      refreshing = false;
      refreshBtn.disabled = false;
      refreshBtn.classList.remove('is-loading');
    }
  }

  function mount() {
    if (document.getElementById(panelId)) return;
    injectStyles();
    var panel = createPanel();
    document.body.appendChild(panel);
    refreshAll();
    setInterval(function () {
      if (!document.hidden) refreshAll();
    }, AUTO_MS);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) refreshAll();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mount);
  } else {
    mount();
  }
})();</script></body>
