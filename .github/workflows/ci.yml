# CI + release gate for dsh-quota-panel.
#
# check: build the TypeScript sources (src/*.ts -> lib/, org tool-bundle
#         template via scripts/build.mjs: tsc + vendored runtime copy),
#         prove the committed lib/ matches a fresh build, run the
#         committed dual-face test suite (host RPC half against mocked
#         upstreams + real local proxy servers, browser half in a vm
#         sandbox), the @deepseek-ai/dsh-plugin-check health report
#         (gated by scripts/plugin-check.mjs, strict: any error or warning
#         fails), then npm pack and proof the tarball is complete and
#         self-contained. Runtime stays zero-dependency by design, so
#         "self-contained" is stricter than dsh-llm-newapi's check: the
#         host bundle may import NOTHING but node: builtins and relative
#         paths, and the client bundle nothing but react (supplied by the
#         host's browser module loader).
#
# boot: real-install gate — install the packed tarball through the dsh
#         CLI into a fresh DSH_HOME, seed one dummy credential, and
#         require `dsh web` to boot serving the plugin: the client
#         bundle must be served and the /dsh-quota-panel RPC channel
#         must answer a real `specs` call (405 = the SPA fallback, i.e.
#         the channel never registered). The specs response must list
#         the explicit patch row AND the catalog row auto-discovered
#         from the seeded credential — proving the v0.5+ catalog probe
#         pipeline works end-to-end in a genuine boot.
#
# tag:  main pushes are auto-tagged after check+boot pass: the tag is
#         `v<package.json version>` (the version string itself carries the
#         DSH host line and the local revision, e.g. 0.1.7-rc.1-v0.1 →
#         v0.1.7-rc.1-v0.1), and the release run is dispatched on it.
#         Releases for other host lines are cut from their own maintenance
#         branch by pushing the tag by hand (or via the `release` dispatch
#         input); main only ever tags its own line.
#
# release: on a `v*` tag (auto-tagged or pushed by hand) — re-runs
#         check+boot on the exact tag, then publishes along the channel the
#         DSH host line itself rides: the `classify` job reads
#         `@deepseek-ai/dsh`'s own npm dist-tags, so a release whose host line
#         is npm `latest` publishes as npm `latest` (GitHub release, gated by
#         the `production` environment's required reviewer), and every other
#         line publishes under that line's dist-tag (GitHub pre-release, no
#         approval). A broken build can therefore never become what a bare
#         install resolves to.
#
# boot resolves the host line from package.json's exact `@deepseek-ai/dsh*`
#         peers, so each line's release is gated against the dsh version it
#         declares rather than a hardcoded one.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create and push the release tag for package.json#version on this ref (e.g. v0.1.5-rc.3-v0.1). Leave false to only run check + boot.'
        required: false
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Build (src/*.ts -> lib/ + vendored runtime copy)
        run: npm run build
      - name: Committed artifacts are current
        run: |
          git diff --exit-code -- lib/ || {
            echo "::error::lib/ is stale — run 'npm run build' and commit the rebuilt artifacts (github: installs build from the committed lib/)"
            exit 1
          }
      - name: Dual-face test suite (host RPC + browser client)
        run: node scripts/test-page-script.mjs
      # Health check with @deepseek-ai/dsh-plugin-check (omdsh-dev): the
      # checker's programmatic checkRepo() runs against this checkout and
      # scripts/plugin-check.mjs fails on ANY error or warning — the repo
      # follows the org TypeScript tool-bundle template, so nothing is waived.
      - name: plugin_check (dsh-plugin-check health report)
        run: |
          set -euo pipefail
          ENVDIR="$RUNNER_TEMP/plugin-check-env"
          mkdir -p "$ENVDIR" && cd "$ENVDIR"
          npm init -y >/dev/null
          # --ignore-scripts: the checker's prepack would build TS from its
          # devDependencies; its lib/ is committed, so the pack installs as is.
          #
          # 2026-08-21 workaround for the @deepseek-ai bulk republish: npm's
          # git-dep path consumes the checker's COMMITTED package-lock.json,
          # whose integrity hashes are pinned to the PRE-republish tarballs →
          # EINTEGRITY against today's bytes regardless of registry (6 red
          # runs). Bypass the git-dep machinery: fetch the GitHub tarball,
          # DROP the stale lockfile, and install its runtime deps in place
          # (mirror registry, verified self-consistent). Revert to the plain
          # `npm install github:omdsh-dev/dsh-plugin-check …` once the
          # checker repo refreshes its lockfile.
          # Peer companions the checker imports: installed at the env root
          # FIRST — a later npm install here would prune the hand-placed
          # checker as extraneous, so the checker goes in LAST.
          (cd "$ENVDIR" && npm install --no-audit --no-fund \
            --ignore-scripts \
            --registry=https://registry.npmmirror.com \
            @deepseek-ai/dsh-tools \
            @deepseek-ai/dsh-invariants \
            @deepseek-ai/cordis)
          CHECKER_DIR="$ENVDIR/node_modules/@deepseek-ai/dsh-plugin-check"
          mkdir -p "$CHECKER_DIR"
          curl -fsSL https://codeload.github.com/omdsh-dev/dsh-plugin-check/tar.gz/refs/heads/main \
            | tar xz -C "$CHECKER_DIR" --strip-components=1
          rm -f "$CHECKER_DIR/package-lock.json"
          # Install the checker's runtime deps in place (its lib/ is
          # committed; --ignore-scripts skips the TS-building prepack). This
          # install runs inside CHECKER_DIR only — it cannot prune siblings.
          (cd "$CHECKER_DIR" && npm install --no-audit --no-fund \
            --ignore-scripts --omit=dev \
            --registry=https://registry.npmmirror.com)
          cd "$GITHUB_WORKSPACE"
          PLUGIN_CHECK_DEPS="$ENVDIR" node scripts/plugin-check.mjs .
      - name: Pack distribution tarball
        run: npm pack
      - name: Packed tarball is complete and self-contained
        run: |
          set -euo pipefail
          mkdir /tmp/selfcheck && tar -xzf dsh-quota-panel-*.tgz -C /tmp/selfcheck
          cd /tmp/selfcheck/package
          # every manifest entry is actually packed
          for f in \
            lib/index.js lib/index.d.ts lib/client.js \
            lib/vendor/schemastery.mjs lib/vendor/cosmokit.js \
            cordis.patch.yml; do
            [ -f "$f" ] || { echo "::error::$f missing from the tarball (check the files list in package.json)"; exit 1; }
          done
          # zero-dependency contract: no npm specifier may appear at all.
          # (dsh-llm-newapi allows @deepseek-ai/* seam packages; this
          # plugin deliberately has none — vendored schema, node stdlib.)
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const host = readFileSync('lib/index.js', 'utf8')
            const client = readFileSync('lib/client.js', 'utf8')
            const external = (source) =>
              [...source.matchAll(/from\\s+[\"']([^\"']+)[\"']|require\\s*\\(\\s*[\"']([^\"']+)[\"']\\s*\\)/g)]
                .map((m) => m[1] ?? m[2])
                .filter((s) => s && !s.startsWith('.') && !s.startsWith('node:'))
            const hostExt = [...new Set(external(host))]
            const clientExt = [...new Set(external(client))].filter((s) => s !== 'react')
            if (hostExt.length > 0 || clientExt.length > 0) {
              console.error('zero-dependency violation — host: [' + hostExt + '] client: [' + clientExt + ']');
              process.exit(1)
            }
            console.log('self-contained: host imports node:/relative only; client adds react (host-supplied)')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dsh-quota-panel-*.tgz
          if-no-files-found: error

  # Real-boot gate: install the packed tarball through the dsh CLI into a
  # fresh DSH_HOME and require `dsh web` to boot serving the plugin.
  boot:
    needs: check
    runs-on: ubuntu-latest
    steps:
      # Checkout first: actions/checkout cleans the workspace, so a downloaded
      # artifact placed before it would be wiped.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Resolve the DSH host line from the manifest
        id: line
        run: |
          set -euo pipefail
          DSH_VERSION="$(node -e '
            const p = require("./package.json")
            const versions = [...new Set(Object.keys(p.peerDependencies ?? {})
              .filter((name) => name === "@deepseek-ai/dsh" || name.startsWith("@deepseek-ai/dsh-"))
              .map((name) => p.peerDependencies[name]))]
            if (versions.length !== 1) {
              console.error("expected exactly one declared DSH host line, got " + JSON.stringify(versions))
              process.exit(1)
            }
            process.stdout.write(versions[0])
          ')"
          echo "dsh_version=$DSH_VERSION" >> "$GITHUB_OUTPUT"
          echo "boot gate rides @deepseek-ai/dsh@$DSH_VERSION (from package.json peers)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dsh and pnpm
        # The host line comes from the checkout's own peers, so a maintenance
        # branch releasing against an older dsh is gated against that version.
        # --registry=npmmirror: same npmjs CDN stale-packument workaround as
        # the plugin_check step (@deepseek-ai/* deps hit EINTEGRITY on the
        # default registry since the 2026-08-21 bulk republish). REVERT later.
        run: npm install -g --registry=https://registry.npmmirror.com "@deepseek-ai/dsh@${{ steps.line.outputs.dsh_version }}" pnpm
      - name: Install the packed tarball into a fresh web profile
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          mkdir -p "$DSH_HOME"
          TARBALL="$(pwd)/$(ls dsh-quota-panel-*.tgz)"
          dsh plugin --profile web add "$TARBALL"
          PROFILE="$DSH_HOME/profiles/web/package.json"
          if [ ! -f "$PROFILE" ]; then
            echo "::error::dsh plugin add did not scaffold the web profile at $PROFILE"
            find "$DSH_HOME" -maxdepth 3
            exit 1
          fi
          # Register the bundle row (the documented install step 2), keeping
          # whatever rows the scaffold already wrote.
          node -e '
            const fs = require("node:fs")
            const path = process.env.DSH_HOME + "/profiles/web/package.json"
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"))
            pkg.dsh ??= {}
            pkg.dsh.profile ??= {}
            pkg.dsh.profile.bundles ??= ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app"]
            for (const row of ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-quota-panel"]) {
              if (!pkg.dsh.profile.bundles.includes(row)) pkg.dsh.profile.bundles.push(row)
            }
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n")
            console.log("bundles:", pkg.dsh.profile.bundles.join(", "))
          '
          # Seed one dummy credential so the catalog auto-discovery has
          # something to probe (specs only resolves refs — offline).
          # chmod 600 is mandatory: credentials-local refuses owner-readable-
          # beyond-owner files (default umask gives 644) and the whole plugin
          # tree fails to load.
          printf 'ZAI_CODING_CN_API_KEY: ci-dummy-key\n' > "$DSH_HOME/.credentials.yaml"
          chmod 600 "$DSH_HOME/.credentials.yaml"
      - name: dsh web boots and serves the plugin
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          LOG="$RUNNER_TEMP/dsh-web.log"
          PROBE_BODY="$RUNNER_TEMP/probe-body"
          dsh web > "$LOG" 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT

          # wait_for <expected-code> <method> <url> [curl args...]
          # Every probe is a retried wait, never a one-shot check: on a cold
          # boot the SPA answers before the static plugin routes settle, and
          # an early probe can even take a connection reset (curl exit 56 →
          # code 000). curl failures are absorbed (|| true); only the final
          # HTTP code decides. Sets LAST_CODE and returns non-zero on timeout.
          wait_for() {
            expected="$1"; shift
            method="$1"; shift
            url="$1"; shift
            LAST_CODE="000"
            for _ in $(seq 1 90); do
              if ! kill -0 "$WEB_PID" 2>/dev/null; then
                echo "::error::dsh web exited during startup"
                cat "$LOG"
                exit 1
              fi
              LAST_CODE="$(curl -s -o "$PROBE_BODY" -w '%{http_code}' -X "$method" "$url" "$@" 2>/dev/null || true)"
              [ "$LAST_CODE" = "$expected" ] && return 0
              sleep 1
            done
            return 1
          }

          # DSH fences the web surface behind a browser session: `dsh web`
          # prints a one-time `?token=` URL that exchanges for the session
          # cookie, and every probe below (including `/api`) needs that
          # cookie. Older DSH served plain loopback probes, so a missing
          # token just leaves AUTH empty instead of failing the gate.
          COOKIE_JAR="$RUNNER_TEMP/dsh-cookies"
          AUTH=()
          TOKEN=""
          for _ in $(seq 1 60); do
            kill -0 "$WEB_PID" 2>/dev/null || break
            TOKEN="$(grep -o 'token=[A-Za-z0-9_-]*' "$LOG" 2>/dev/null | head -1 | cut -d= -f2 || true)"
            if [ -n "$TOKEN" ]; then
              curl -s -c "$COOKIE_JAR" -o /dev/null "http://127.0.0.1:3080/?token=$TOKEN" || true
              if [ -s "$COOKIE_JAR" ]; then break; fi
            fi
            sleep 1
          done
          if [ -s "$COOKIE_JAR" ]; then
            AUTH=(-b "$COOKIE_JAR")
            echo "browser session established from the startup token"
          else
            echo "no startup token in the log; probing without a session (older DSH)"
          fi

          wait_for 200 GET http://127.0.0.1:3080/ "${AUTH[@]}" || {
            echo "::error::dsh web did not become ready on :3080 (last HTTP $LAST_CODE)"
            cat "$LOG"
            exit 1
          }
          echo "web ready on :3080"

          # The plugin's browser half is served for the module loader. DSH
          # composes revisioned module URLs (`/plugins/??<id>/client.js&rev=<rev>`)
          # and 404s the plain path, so read the advertised URL out of the boot
          # payload; fall back to the plain path for older versions. 0.1.7 made
          # app-owned browser routes document-relative (`plugins/??...`), so
          # normalize the advertised reference to a path before probing it.
          BOOT_HTML="$RUNNER_TEMP/boot.html"
          curl -s -o "$BOOT_HTML" "${AUTH[@]}" http://127.0.0.1:3080/ || true
          CLIENT_URL="$(node -e '
            const fs = require("node:fs")
            let html = ""
            try { html = fs.readFileSync(process.argv[1], "utf8") } catch {}
            const m = /"id":"dsh-quota-panel","url":"([^"]+)"/.exec(html)
            const url = m ? m[1].replace(/&amp;/g, "&") : ""
            process.stdout.write(url === "" || url.startsWith("/") ? url : "/" + url)
          ' "$BOOT_HTML" 2>/dev/null || true)"
          if [ -z "$CLIENT_URL" ]; then
            CLIENT_URL="/plugins/dsh-quota-panel/client.js"
            echo "boot payload advertised no module URL; probing $CLIENT_URL"
          else
            echo "advertised client module: $CLIENT_URL"
          fi
          wait_for 200 GET "http://127.0.0.1:3080$CLIENT_URL" "${AUTH[@]}" || {
            echo "::error::client bundle not served (HTTP $LAST_CODE)"
            cat "$LOG"
            exit 1
          }
          client="$LAST_CODE"

          # The plugin's RPC endpoints ride Connection's authenticated /api
          # channel: 405 = the SPA fallback rejecting the POST (the route did
          # not register), 401/403 = the /api fence rejected the probe.
          wait_for 200 POST http://127.0.0.1:3080/api/dsh-quota-panel/specs \
            "${AUTH[@]}" \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"ci-boot","method":"dsh-quota-panel/specs","payload":null}' || {
            if [ "$LAST_CODE" = "405" ]; then
              echo "::error::RPC endpoint /api/dsh-quota-panel/specs missing (405) — the route did not register"
            elif [ "$LAST_CODE" = "404" ]; then
              echo "::error::RPC endpoint /api/dsh-quota-panel/specs unknown to the API channel (404) — the plugin mounted no route (check the boot log for a failed plugin mount)"
            elif [ "$LAST_CODE" = "401" ] || [ "$LAST_CODE" = "403" ]; then
              echo "::error::RPC endpoint answered $LAST_CODE — the /api fence rejected the session cookie"
            else
              echo "::error::specs RPC answered HTTP $LAST_CODE"
            fi
            cat "$LOG"
            cat "$PROBE_BODY" 2>/dev/null || true
            exit 1
          }
          rpc="$LAST_CODE"
          BODY="$PROBE_BODY"
          # Functional assertions on the real specs response:
          #   * ok:true — the handler answered, not a fallback page
          #   * "zai-coding-cn" — catalog auto-discovery probed the seeded
          #     credential and mounted the row (the v0.6 coding-plan path)
          #   * no "deepseek"/"opencode-go" — providers without a configured
          #     key must NOT appear (cordis.patch.yml ships no explicit rows)
          for needle in '"ok":true' '"zai-coding-cn"'; do
            if ! grep -qF "$needle" "$BODY"; then
              echo "::error::specs response missing $needle";
              cat "$BODY"
              exit 1
            fi
          done
          if grep -qF '"deepseek"' "$BODY" || grep -qF '"opencode-go"' "$BODY"; then
            echo "::error::unconfigured provider row leaked into specs";
            cat "$BODY"
            exit 1
          fi
          echo "boot gate passed: web ready, client HTTP $client, specs HTTP $rpc, rows discovered"

  # Auto-tag PRE-RELEASES from main — only when check + boot both passed.
  # A version with a -suffix (0.9.0-rc.1) is auto-tagged and released to
  # the next channel; a plain stable version (0.9.0) is NEVER auto-tagged:
  # it waits for a human to promote a green rc via the workflow_dispatch
  # `rc_tag` input (promote job below). (Replaces tag-release.yml, which
  # tagged without any validation.)
  tag:
    needs: [check, boot]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # gh workflow run (dispatch the release run on the new tag)
    concurrency:
      group: tag-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the release tag from package.json
        id: ver
        # Tag rule: `v<package.json version>` — the version string already
        # carries the host line and the local revision (0.1.7-rc.1-v0.1 →
        # v0.1.7-rc.1-v0.1). The channel is resolved later, from the dsh
        # line's own npm dist-tags (see the classify job).
        run: |
          set -euo pipefail
          v="v$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "auto-tag: $v"
      - name: Check whether the tag already exists
        id: check
        run: |
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.version }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create and push the release tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
      # A tag pushed with GITHUB_TOKEN does NOT trigger the tags:['v*']
      # workflow (GitHub's recursion guard), so the release jobs would never
      # run. Dispatch the release run on the new tag explicitly.
      - name: Trigger the release run on the new tag
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.version }}
        run: gh workflow run ci.yml --ref "$TAG"

  # Manual tag cut for a maintenance line: dispatch with `release` on the
  # branch that carries the version to publish (e.g. release/0.1.5-rc.3).
  # Same dance as the auto-tag job — create the annotated tag, push it, then
  # dispatch the release run on it (a GITHUB_TOKEN push never triggers the
  # tags:['v*'] workflow by itself).
  release-tag:
    needs: [check, boot]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh workflow run ci.yml --ref "$TAG"

  # Which channel does this release ride? One line of indirection: the plugin
  # mirrors the dist-tag @deepseek-ai/dsh itself carries for the host line the
  # checkout declares. dsh `latest` -> npm `latest` (GitHub release, the
  # production environment's reviewer confirms); dsh `next`/`alpha` -> that
  # dist-tag (GitHub pre-release, no approval); a line no dist-tag points at
  # falls back to `next`.
  classify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve the npm dist-tag for the declared host line
        id: channel
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          DSH_VERSION="$(node -e '
            const p = require("./package.json")
            const versions = [...new Set(Object.keys(p.peerDependencies ?? {})
              .filter((name) => name === "@deepseek-ai/dsh" || name.startsWith("@deepseek-ai/dsh-"))
              .map((name) => p.peerDependencies[name]))]
            if (versions.length !== 1) {
              console.error("expected exactly one declared DSH host line, got " + JSON.stringify(versions))
              process.exit(1)
            }
            process.stdout.write(versions[0])
          ')"
          if [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package.json version v$VERSION"
            exit 1
          fi
          TAGS="$(npm view @deepseek-ai/dsh dist-tags --json)"
          CHANNEL="$(node -e '
            const raw = JSON.parse(process.argv[1])
            const tags = Array.isArray(raw) ? (raw[0] ?? {}) : raw
            const want = process.argv[2]
            for (const tag of ["latest", "next", "alpha"]) {
              if (tags[tag] === want) { process.stdout.write(tag); process.exit(0) }
            }
            process.stdout.write("next")
          ' "$TAGS" "$DSH_VERSION")"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release v$VERSION rides npm dist-tag: $CHANNEL (host line @deepseek-ai/dsh@$DSH_VERSION)"

  # Pre-release channel: every host line that is not dsh's own npm `latest`.
  # GitHub pre-release, npm publish under the line's dist-tag, no approval.
  release-pre:
    needs: [check, boot, classify]
    if: startsWith(github.ref, 'refs/tags/v') && needs.classify.outputs.channel != 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Create the GitHub pre-release with the built tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --prerelease --generate-notes dsh-quota-panel-*.tgz \
            || gh release upload "$TAG" dsh-quota-panel-*.tgz --clobber
      - name: Set up node with the npm registry (only when NPM_TOKEN is configured)
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # The dist-tag is the classify job's answer, never a hardcoded `next`:
      # a maintenance line publishes under whatever tag dsh itself carries.
      - name: Publish to npm under the line's dist-tag (only when NPM_TOKEN is configured)
        if: env.NPM_TOKEN != ''
        run: npm publish dsh-quota-panel-*.tgz --access public --tag "${{ needs.classify.outputs.channel }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Shipped channel: the host line dsh itself publishes as `latest`. GitHub
  # release, npm `latest`, and the `production` environment's required
  # reviewer is the human confirmation before anything moves.
  release-latest:
    needs: [check, boot, classify]
    if: startsWith(github.ref, 'refs/tags/v') && needs.classify.outputs.channel == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Create the GitHub release with the built tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes dsh-quota-panel-*.tgz \
            || gh release upload "$TAG" dsh-quota-panel-*.tgz --clobber
      - name: Set up node with the npm registry (only when NPM_TOKEN is configured)
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm under the latest dist-tag (only when NPM_TOKEN is configured)
        if: env.NPM_TOKEN != ''
        run: npm publish dsh-quota-panel-*.tgz --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
