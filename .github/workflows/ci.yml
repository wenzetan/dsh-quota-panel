# CI + release gate for dsh-quota-panel.
#
# check: build the TypeScript sources (src/*.ts -> lib/, org tool-bundle
#         template via scripts/build.mjs: tsc + vendored runtime copy),
#         prove the committed lib/ matches a fresh build, run the
#         committed dual-face test suite (host RPC half against mocked
#         upstreams + real local proxy servers, browser half in a vm
#         sandbox), the @deepseek-ai/dsh-plugin-check health report
#         (gated by scripts/plugin-check.mjs, strict: any error or warning
#         fails), then npm pack and proof the tarball is complete and
#         self-contained. Runtime stays zero-dependency by design, so
#         "self-contained" is stricter than dsh-llm-newapi's check: the
#         host bundle may import NOTHING but node: builtins and relative
#         paths, and the client bundle nothing but react (supplied by the
#         host's browser module loader).
#
# boot: real-install gate — install the packed tarball through the dsh
#         CLI into a fresh DSH_HOME, seed one dummy credential, and
#         require `dsh web` to boot serving the plugin: the client
#         bundle must be served and the /dsh-quota-panel RPC channel
#         must answer a real `specs` call (405 = the SPA fallback, i.e.
#         the channel never registered). The specs response must list
#         the explicit patch row AND the catalog row auto-discovered
#         from the seeded credential — proving the v0.5+ catalog probe
#         pipeline works end-to-end in a genuine boot.
#
# tag:  PRE-RELEASE versions (X.Y.Z-rc.N) are auto-tagged from main after
#         check+boot pass and dispatched to the release run. STABLE versions
#         (plain X.Y.Z) are never auto-tagged: a human promotes a green rc
#         via the workflow_dispatch `rc_tag` input (promote job), which
#         creates the stable twin tag on the same commit and dispatches the
#         release run.
#
# release: on the v* tag (from the tag job / promote job or by hand) —
#         re-runs check+boot on the exact tag, then publishes along one of
#         two channels picked by the version string: -rc.N/-beta.N suffixes
#         go to the pre-release channel (GitHub prerelease + npm dist-tag
#         `next`, no approval needed; a reclaim step keeps `latest` off
#         prereleases); plain X.Y.Z goes to the stable channel (GitHub
#         `production` environment with a required reviewer = the human
#         confirmation, npm dist-tag `latest`). A broken build can
#         therefore never become what a bare install resolves to.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'Promote a green pre-release tag to its stable twin on the same commit (e.g. v0.9.0-rc.3 -> v0.9.0). Leave empty to only run check + boot.'
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Build (src/*.ts -> lib/ + vendored runtime copy)
        run: npm run build
      - name: Committed artifacts are current
        run: |
          git diff --exit-code -- lib/ || {
            echo "::error::lib/ is stale — run 'npm run build' and commit the rebuilt artifacts (github: installs build from the committed lib/)"
            exit 1
          }
      - name: Dual-face test suite (host RPC + browser client)
        run: node scripts/test-page-script.mjs
      # Health check with @deepseek-ai/dsh-plugin-check (omdsh-dev): the
      # checker's programmatic checkRepo() runs against this checkout and
      # scripts/plugin-check.mjs fails on ANY error or warning — the repo
      # follows the org TypeScript tool-bundle template, so nothing is waived.
      - name: plugin_check (dsh-plugin-check health report)
        run: |
          set -euo pipefail
          ENVDIR="$RUNNER_TEMP/plugin-check-env"
          mkdir -p "$ENVDIR" && cd "$ENVDIR"
          npm init -y >/dev/null
          # --ignore-scripts: the checker's prepack would build TS from its
          # devDependencies; its lib/ is committed, so the pack installs as is.
          #
          # 2026-08-21 workaround for the @deepseek-ai bulk republish: npm's
          # git-dep path consumes the checker's COMMITTED package-lock.json,
          # whose integrity hashes are pinned to the PRE-republish tarballs →
          # EINTEGRITY against today's bytes regardless of registry (6 red
          # runs). Bypass the git-dep machinery: fetch the GitHub tarball,
          # DROP the stale lockfile, and install its runtime deps in place
          # (mirror registry, verified self-consistent). Revert to the plain
          # `npm install github:omdsh-dev/dsh-plugin-check …` once the
          # checker repo refreshes its lockfile.
          # Peer companions the checker imports: installed at the env root
          # FIRST — a later npm install here would prune the hand-placed
          # checker as extraneous, so the checker goes in LAST.
          (cd "$ENVDIR" && npm install --no-audit --no-fund \
            --ignore-scripts \
            --registry=https://registry.npmmirror.com \
            @deepseek-ai/dsh-tools \
            @deepseek-ai/dsh-invariants \
            @deepseek-ai/cordis)
          CHECKER_DIR="$ENVDIR/node_modules/@deepseek-ai/dsh-plugin-check"
          mkdir -p "$CHECKER_DIR"
          curl -fsSL https://codeload.github.com/omdsh-dev/dsh-plugin-check/tar.gz/refs/heads/main \
            | tar xz -C "$CHECKER_DIR" --strip-components=1
          rm -f "$CHECKER_DIR/package-lock.json"
          # Install the checker's runtime deps in place (its lib/ is
          # committed; --ignore-scripts skips the TS-building prepack). This
          # install runs inside CHECKER_DIR only — it cannot prune siblings.
          (cd "$CHECKER_DIR" && npm install --no-audit --no-fund \
            --ignore-scripts --omit=dev \
            --registry=https://registry.npmmirror.com)
          cd "$GITHUB_WORKSPACE"
          PLUGIN_CHECK_DEPS="$ENVDIR" node scripts/plugin-check.mjs .
      - name: Pack distribution tarball
        run: npm pack
      - name: Packed tarball is complete and self-contained
        run: |
          set -euo pipefail
          mkdir /tmp/selfcheck && tar -xzf dsh-quota-panel-*.tgz -C /tmp/selfcheck
          cd /tmp/selfcheck/package
          # every manifest entry is actually packed
          for f in \
            lib/index.js lib/index.d.ts lib/client.js \
            lib/vendor/schemastery.mjs lib/vendor/cosmokit.js \
            cordis.patch.yml; do
            [ -f "$f" ] || { echo "::error::$f missing from the tarball (check the files list in package.json)"; exit 1; }
          done
          # zero-dependency contract: no npm specifier may appear at all.
          # (dsh-llm-newapi allows @deepseek-ai/* seam packages; this
          # plugin deliberately has none — vendored schema, node stdlib.)
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const host = readFileSync('lib/index.js', 'utf8')
            const client = readFileSync('lib/client.js', 'utf8')
            const external = (source) =>
              [...source.matchAll(/from\\s+[\"']([^\"']+)[\"']|require\\s*\\(\\s*[\"']([^\"']+)[\"']\\s*\\)/g)]
                .map((m) => m[1] ?? m[2])
                .filter((s) => s && !s.startsWith('.') && !s.startsWith('node:'))
            const hostExt = [...new Set(external(host))]
            const clientExt = [...new Set(external(client))].filter((s) => s !== 'react')
            if (hostExt.length > 0 || clientExt.length > 0) {
              console.error('zero-dependency violation — host: [' + hostExt + '] client: [' + clientExt + ']');
              process.exit(1)
            }
            console.log('self-contained: host imports node:/relative only; client adds react (host-supplied)')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dsh-quota-panel-*.tgz
          if-no-files-found: error

  # Real-boot gate: install the packed tarball through the dsh CLI into a
  # fresh DSH_HOME and require `dsh web` to boot serving the plugin.
  boot:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dsh and pnpm
        # --registry=npmmirror: same npmjs CDN stale-packument workaround as
        # the plugin_check step (@deepseek-ai/* deps hit EINTEGRITY on the
        # default registry since the 2026-08-21 bulk republish). REVERT later.
        run: npm install -g --registry=https://registry.npmmirror.com @deepseek-ai/dsh pnpm
      - name: Install the packed tarball into a fresh web profile
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          mkdir -p "$DSH_HOME"
          TARBALL="$(pwd)/$(ls dsh-quota-panel-*.tgz)"
          dsh plugin --profile web add "$TARBALL"
          PROFILE="$DSH_HOME/profiles/web/package.json"
          if [ ! -f "$PROFILE" ]; then
            echo "::error::dsh plugin add did not scaffold the web profile at $PROFILE"
            find "$DSH_HOME" -maxdepth 3
            exit 1
          fi
          # Register the bundle row (the documented install step 2), keeping
          # whatever rows the scaffold already wrote.
          node -e '
            const fs = require("node:fs")
            const path = process.env.DSH_HOME + "/profiles/web/package.json"
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"))
            pkg.dsh ??= {}
            pkg.dsh.profile ??= {}
            pkg.dsh.profile.bundles ??= ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app"]
            for (const row of ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-quota-panel"]) {
              if (!pkg.dsh.profile.bundles.includes(row)) pkg.dsh.profile.bundles.push(row)
            }
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n")
            console.log("bundles:", pkg.dsh.profile.bundles.join(", "))
          '
          # Seed one dummy credential so the catalog auto-discovery has
          # something to probe (specs only resolves refs — offline).
          # chmod 600 is mandatory: credentials-local refuses owner-readable-
          # beyond-owner files (default umask gives 644) and the whole plugin
          # tree fails to load.
          printf 'ZAI_CODING_CN_API_KEY: ci-dummy-key\n' > "$DSH_HOME/.credentials.yaml"
          chmod 600 "$DSH_HOME/.credentials.yaml"
      - name: dsh web boots and serves the plugin
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          LOG="$RUNNER_TEMP/dsh-web.log"
          PROBE_BODY="$RUNNER_TEMP/probe-body"
          dsh web > "$LOG" 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT

          # wait_for <expected-code> <method> <url> [curl args...]
          # Every probe is a retried wait, never a one-shot check: on a cold
          # boot the SPA answers before the static plugin routes settle, and
          # an early probe can even take a connection reset (curl exit 56 →
          # code 000). curl failures are absorbed (|| true); only the final
          # HTTP code decides. Sets LAST_CODE and returns non-zero on timeout.
          wait_for() {
            expected="$1"; shift
            method="$1"; shift
            url="$1"; shift
            LAST_CODE="000"
            for _ in $(seq 1 90); do
              if ! kill -0 "$WEB_PID" 2>/dev/null; then
                echo "::error::dsh web exited during startup"
                cat "$LOG"
                exit 1
              fi
              LAST_CODE="$(curl -s -o "$PROBE_BODY" -w '%{http_code}' -X "$method" "$url" "$@" 2>/dev/null || true)"
              [ "$LAST_CODE" = "$expected" ] && return 0
              sleep 1
            done
            return 1
          }

          wait_for 200 GET http://127.0.0.1:3080/ || {
            echo "::error::dsh web did not become ready on :3080 (last HTTP $LAST_CODE)"
            cat "$LOG"
            exit 1
          }
          echo "web ready on :3080"

          # The plugin's browser half is served for the module loader.
          wait_for 200 GET http://127.0.0.1:3080/plugins/dsh-quota-panel/client.js || {
            echo "::error::client bundle not served (HTTP $LAST_CODE)"
            cat "$LOG"
            exit 1
          }
          client="$LAST_CODE"

          # The plugin's RPC channel. 405 = the SPA fallback rejecting the
          # POST, i.e. the channel did not register; retried until 200 so a
          # late registration still passes, then asserted functionally below.
          wait_for 200 POST http://127.0.0.1:3080/dsh-quota-panel/specs \
            -H 'content-type: application/json' \
            -d '{"type":"client-request","rpcId":"ci-boot","method":"specs","payload":null}' || {
            if [ "$LAST_CODE" = "405" ]; then
              echo "::error::RPC channel /dsh-quota-panel missing (405) — the channel did not register"
            else
              echo "::error::specs RPC answered HTTP $LAST_CODE"
            fi
            cat "$LOG"
            cat "$PROBE_BODY" 2>/dev/null || true
            exit 1
          }
          rpc="$LAST_CODE"
          BODY="$PROBE_BODY"
          # Functional assertions on the real specs response:
          #   * ok:true — the handler answered, not a fallback page
          #   * "zai-coding-cn" — catalog auto-discovery probed the seeded
          #     credential and mounted the row (the v0.6 coding-plan path)
          #   * no "deepseek"/"opencode-go" — providers without a configured
          #     key must NOT appear (cordis.patch.yml ships no explicit rows)
          for needle in '"ok":true' '"zai-coding-cn"'; do
            if ! grep -qF "$needle" "$BODY"; then
              echo "::error::specs response missing $needle";
              cat "$BODY"
              exit 1
            fi
          done
          if grep -qF '"deepseek"' "$BODY" || grep -qF '"opencode-go"' "$BODY"; then
            echo "::error::unconfigured provider row leaked into specs";
            cat "$BODY"
            exit 1
          fi
          echo "boot gate passed: web ready, client HTTP $client, specs HTTP $rpc, rows discovered"

  # Auto-tag PRE-RELEASES from main — only when check + boot both passed.
  # A version with a -suffix (0.9.0-rc.1) is auto-tagged and released to
  # the next channel; a plain stable version (0.9.0) is NEVER auto-tagged:
  # it waits for a human to promote a green rc via the workflow_dispatch
  # `rc_tag` input (promote job below). (Replaces tag-release.yml, which
  # tagged without any validation.)
  tag:
    needs: [check, boot]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # gh workflow run (dispatch the release run on the new tag)
    concurrency:
      group: tag-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version and channel from package.json
        id: ver
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check whether the tag already exists
        id: check
        run: |
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.version }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create and push the pre-release tag
        if: steps.check.outputs.exists == 'false' && steps.ver.outputs.prerelease == 'true'
        env:
          TAG: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
      # A tag pushed with GITHUB_TOKEN does NOT trigger the tags:['v*']
      # workflow (GitHub's recursion guard), so the release jobs would never
      # run. Dispatch the release run on the new tag explicitly.
      - name: Trigger the release run on the new tag
        if: steps.check.outputs.exists == 'false' && steps.ver.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.version }}
        run: gh workflow run ci.yml --ref "$TAG"

  # Manual promotion: the human confirmation step for stable versions.
  # Dispatch with `rc_tag` set (e.g. v0.9.0-rc.3) — this job verifies that
  # tag's CI run was green on exactly that commit, then creates a
  # VERSION-ONLY bump commit on top of it (package.json X.Y.Z, replacing the
  # rc suffix — npm refuses to publish a prerelease version to latest, and a
  # stable release must ship the plain version anyway), tags it as the
  # stable twin v0.9.0, and dispatches the release run. The bump keeps the
  # stable tag's tree identical to the validated rc except for the version
  # string, so check+boot on the tag re-verifies exactly the shipped bits.
  # If the `production` environment has a required reviewer, release-stable
  # waits there for a second, explicit approval.
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.rc_tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write  # gh run list + gh workflow run (verify CI, dispatch release)
      contents: write
      # The stable twin tags the validated rc commit, which may predate
      # later workflow fixes on main; pushing a ref whose workflow files
      # differ from the default branch needs this permission for
      # GITHUB_TOKEN (GitHub App) pushes.
      workflows: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the rc tag and create its stable twin
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC: ${{ inputs.rc_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RC" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$ ]]; then
            echo "::error::$RC is not a pre-release tag (expected vX.Y.Z-rc.N or similar)"
            exit 1
          fi
          STABLE="v${RC#v}"; STABLE="${STABLE%%-*}"
          STABLE_VER="${STABLE#v}"
          # Annotated tags (all tags this workflow's tag job creates via
          # `git tag -a`) make git/ref/tags/X return the TAG OBJECT sha,
          # not the commit; peel it so the CI lookup and the stable twin
          # both target the actual commit the rc tested.
          TAGOBJ="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RC}" --jq '.object.sha')"
          TAGTYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RC}" --jq '.object.type')"
          if [ "$TAGTYPE" = "tag" ]; then
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAGOBJ}" --jq '.object.sha')"
          else
            SHA="$TAGOBJ"
          fi
          echo "promoting $RC (commit $SHA) -> $STABLE"
          # Look up CI on the rc TAG's own run (--branch "$RC": the tag job
          # dispatches one right after creating each rc tag, so its
          # head_branch is the tag name). Filtering by commit alone would
          # match THIS promote run itself — dispatched on main, whose head
          # is the rc commit — and read its own in-flight conclusion: a
          # self-shadowing deadlock that could never pass.
          CONCLUSION="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" --workflow CI --branch "$RC" --limit 1 --json conclusion --jq '.[0].conclusion // "none"')"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI for $RC is '$CONCLUSION' (need success) — fix or re-tag before promoting"
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${STABLE}" >/dev/null 2>&1; then
            echo "::error::$STABLE already exists — bump the version instead"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Version-only bump commit on top of the validated rc commit. The
          # surgical replace keeps the diff to the single version line
          # (re-serializing the whole file would churn formatting).
          git checkout --detach "$SHA"
          if ! grep -q "\"version\": \"$STABLE_VER\"" package.json; then
            if ! sed -i "s/\"version\": \"[0-9][^\"]*\"/\"version\": \"$STABLE_VER\"/" package.json; then
              echo "::error::failed to set version $STABLE_VER in package.json"
              exit 1
            fi
          fi
          if ! git diff --quiet -- package.json; then
            git add package.json
            git commit -m "$STABLE: promote $RC to stable (version-only)"
          fi
          STABLE_SHA="$(git rev-parse HEAD)"
          git tag -a "$STABLE" -m "Release $STABLE (stable twin of $RC; version-only bump)" "$STABLE_SHA"
          git push origin "$STABLE"
          echo "stable_tag=$STABLE" >> "$GITHUB_OUTPUT"
      - name: Trigger the release run on the stable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE: ${{ steps.promote.outputs.stable_tag }}
        run: gh workflow run ci.yml --ref "$STABLE"

  # ── Release channels ──────────────────────────────────────────────────
  # Both jobs run on the v* tag push (created by the tag job above or by
  # hand) after check + boot re-verify the exact tag. The version string
  # picks the channel:
  #
  #   v0.8.0-rc.1  (any -suffix)  → PRE-RELEASE channel:
  #     GitHub Release flagged --prerelease, npm published under the
  #     `next` dist-tag. Nothing here can touch `latest`, so a broken
  # build never becomes what `dsh plugin add dsh-quota-panel` resolves to.
  #     No manual approval — fast iteration.
  #
  #   v0.8.0       (plain X.Y.Z)  → STABLE channel:
  #     uses the `production` GitHub environment. Configure that
  #     environment (Settings → Environments → production) with a required
  #     reviewer and the job WAITS for the human confirmation before
  #     creating the GitHub Release and publishing to npm `latest`.
  #     Promote an rc to stable by bumping package.json to the plain
  #     version and pushing — CI re-gates everything from scratch.
  #
  # In both channels the published tarball is the exact artifact that
  # passed check + boot on that tag.
  release-pre:
    needs: [check, boot]
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Create the GitHub pre-release with the built tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --prerelease --generate-notes dsh-quota-panel-*.tgz \
            || gh release upload "$TAG" dsh-quota-panel-*.tgz --clobber
      - name: Set up node with the npm registry (only when NPM_TOKEN is configured)
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # --tag next is the whole point: a pre-release must never become
      # what a bare `npm install dsh-quota-panel` / `dsh plugin add` resolves to.
      - name: Publish to npm under the next dist-tag (only when NPM_TOKEN is configured)
        if: env.NPM_TOKEN != ''
        run: npm publish dsh-quota-panel-*.tgz --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # npm assigns the `latest` dist-tag to the VERY FIRST version published
      # even when publishing under --tag next (npm quirk). latest cannot be
      # deleted (403) — only re-assigned; re-claim it to the newest stable
      # already on the registry, or warn when none exists yet.
      - name: Prerelease must not own the latest dist-tag
        if: env.NPM_TOKEN != ''
        run: |
          LATEST="$(npm dist-tag ls dsh-quota-panel | sed -n 's/^latest: //p')"
          if [ -n "$LATEST" ] && [[ "$LATEST" == *-* ]]; then
            STABLE="$(npm dist-tag ls dsh-quota-panel | sed -n 's/^[^:]*: //p' | grep -v -- '-' | sort -V | tail -1)"
            if [ -n "$STABLE" ]; then
              npm dist-tag add "dsh-quota-panel@$STABLE" latest
              echo "re-claimed latest: $LATEST -> $STABLE"
            else
              echo "::warning::latest=$LATEST is a prerelease and no stable exists yet — the next stable release re-claims latest"
            fi
          else
            echo "latest untouched (${LATEST:-<unset>})"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-stable:
    needs: [check, boot]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Create the GitHub release with the built tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes dsh-quota-panel-*.tgz \
            || gh release upload "$TAG" dsh-quota-panel-*.tgz --clobber
      - name: Set up node with the npm registry (only when NPM_TOKEN is configured)
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm under the latest dist-tag (only when NPM_TOKEN is configured)
        if: env.NPM_TOKEN != ''
        run: npm publish dsh-quota-panel-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
