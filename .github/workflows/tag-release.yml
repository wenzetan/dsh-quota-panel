# Auto-tag releases from main.
#
# On every push to main (and manual dispatch), read the version from
# package.json. If no git tag `v<version>` exists yet, create an annotated
# tag on the pushed commit, push it, and open a GitHub Release with
# auto-generated notes. Workflow therefore: bump "version" in package.json,
# commit to main, push — tagging and release notes are automatic.
#
# Zero-build package on purpose: everything dsh loads (lib/, cordis.patch.yml,
# package.json) is committed, so there is no artifact step between tag and
# release.

name: tag-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from package.json
        id: ver
        run: echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag already exists
        id: check
        run: |
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.version }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push the tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create the GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.version }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
